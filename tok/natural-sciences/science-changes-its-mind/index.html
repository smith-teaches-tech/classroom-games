<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4efe2; --paper-2:#efe8d6; --ink:#2a2622; --ink-soft:#5a5145;
    --blue:#1f3f6e; --blue-2:#3a629c; --amber:#b07d18; --amber-2:#caa24a; --rust:#8a3b2a;

  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--serif); color:var(--ink); background:var(--paper);
    background-image:radial-gradient(circle at 18% 12%, rgba(176,125,24,.05), transparent 40%),radial-gradient(circle at 82% 88%, rgba(31,63,110,.05), transparent 42%),
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(120,108,80,.035) 27px, rgba(120,108,80,.035) 28px);
    line-height:1.45; -webkit-font-smoothing:antialiased; padding:24px 16px 90px;}
  .wrap{max-width:920px;margin:0 auto;}
  header.pin{border:1px solid var(--line); background:linear-gradient(180deg,var(--paper-2),var(--paper));
    padding:16px 20px 14px; box-shadow:0 1px 0 #fff inset, 0 6px 18px rgba(40,34,26,.06); position:sticky; top:0; z-index:5;}
  header.pin::before{content:"NATURAL SCIENCES · LESSON 5"; font-family:var(--mono); font-size:10px; letter-spacing:.22em; color:var(--amber); display:block; margin-bottom:6px;}
  header.pin h1{font-size:28px;font-weight:600;margin:0 0 4px;line-height:1.05;}
  .kq{font-style:italic;color:var(--blue);font-size:18px;margin:2px 0 10px;}

  .tags{display:flex;gap:8px;flex-wrap:wrap;}

  header.pin.slim{padding:8px 20px 6px;} header.pin.slim::before, header.pin.slim h1, header.pin.slim .tags{display:none;} header.pin.slim .kq{margin:0;font-size:16px;}

  .box{border-left:4px solid var(--blue-2);background:rgba(58,98,156,.06);padding:10px 14px;font-size:16.5px;margin:10px 0;}

  .box.amber{border-left-color:var(--amber);background:rgba(176,125,24,.07);} .box.amber b.l{color:var(--amber);}
  .box.red{border-left-color:var(--rust);background:rgba(138,59,42,.06);} .box.red b.l{color:var(--rust);}

  .sortrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--paper);padding:10px 12px;margin:7px 0;border-left:4px solid var(--blue-2);}

  .sortrow .kind.obs{color:var(--good);border-color:var(--good);} .sortrow .kind.th{color:var(--amber);border-color:var(--amber);}
  .reveal-kinds .sortrow .kind{display:inline-block;}

  .block{margin:14px 0;display:none;} .block.shown{display:block;animation:rise .4s ease;}
  .prompt{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;}
  .qline{font-size:17px;color:var(--blue);font-style:italic;margin-bottom:8px;}
  .opts{display:flex;gap:9px;flex-wrap:wrap;}

  .nameit .nb{font-size:16.5px;margin-top:6px;} .nameit .nb p{margin:6px 0;} .nameit .nb em{color:var(--blue);}

  .talk .tb{font-size:17px;margin-top:3px;}

  .nb-time{border:2px solid var(--ox);background:linear-gradient(180deg,rgba(110,42,34,.09),rgba(110,42,34,.04));margin:20px 0;padding:0;}
  .nb-time .nbh{display:flex;justify-content:space-between;align-items:center;background:var(--ox);color:#fff;padding:8px 14px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;}
  .nb-time .nbh .tm{display:flex;gap:8px;align-items:center;}
  .nb-time .nbh button{font-family:var(--mono);font-size:11px;border:1px solid #fff;background:transparent;color:#fff;padding:4px 10px;cursor:pointer;letter-spacing:.08em;}
  .nb-time .nbh .clock{font-size:15px;min-width:52px;text-align:right;}

  .nb-time .nbb ul{margin:6px 0 0;padding-left:20px;font-size:16.5px;}
  .nb-time .nbb .use{font-family:var(--mono);font-size:11px;color:var(--ox);margin-top:8px;letter-spacing:.04em;}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0;}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0;}
  .mini{border:1px solid var(--line);background:var(--paper);padding:11px 13px;font-size:15.5px;}
  .mini .ml{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;}
  .mini .mx{font-size:15px;margin-top:6px;} .mini .mx b{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--rust);margin-right:4px;}
  .pos{border:1px solid var(--line);background:var(--paper);padding:12px 14px;margin:8px 0;}
  .pos .ph{font-weight:600;font-size:17px;}
  .pos .ps{font-size:15.5px;margin-top:4px;}
  .pos .ps b{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-right:4px;}
  .pos.mine{border-color:var(--blue);box-shadow:0 0 0 2px rgba(31,63,110,.15);}

  .steps{display:flex;gap:0;margin:4px 0 16px;border:1px solid var(--line);}
  .steps div{flex:1;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:8px 4px;color:#a99c80;background:var(--paper-2);border-right:1px solid var(--line);}
  .steps div:last-child{border-right:none;}
  .steps div.now{background:var(--blue);color:#fff;font-weight:700;}
  .steps div.past{background:rgba(63,107,58,.14);color:var(--good);}
  .pred{border-left:4px solid var(--blue-2);background:rgba(58,98,156,.06);padding:10px 14px;font-size:16.5px;margin:0 0 10px;}
  .pred b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-2);display:block;margin-bottom:2px;}
  .falsify{border-left:4px solid var(--rust);background:rgba(138,59,42,.06);padding:10px 14px;font-size:16.5px;margin:0 0 12px;}
  .falsify b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--rust);display:block;margin-bottom:2px;}
  .stagebox{background:var(--space);border:1px solid #2c3446;margin:10px 0;}
  .stagebox canvas,.stagebox svg{display:block;width:100%;height:auto;}
  .ctrls{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;margin:10px 0;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);}
  .ctrls input[type=range]{width:100%;accent-color:var(--blue);}
  .ctrls .val{color:var(--blue);font-weight:700;min-width:120px;text-align:right;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0;}
  .chk{font-family:var(--mono);font-size:11.5px;color:var(--ink);display:inline-flex;gap:6px;align-items:center;cursor:pointer;}
  .chk input{accent-color:var(--amber);}
  .readout{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
  .ro{border:1px solid var(--line);background:var(--paper);padding:10px 12px;}
  .ro .rl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);}
  .ro .rv{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--blue);margin-top:3px;}
  .ro .rs{font-size:14.5px;color:var(--ink-soft);margin-top:2px;}
  .ro.newton .rv{color:var(--rust);}
  .world{border:1px solid var(--good);background:rgba(63,107,58,.07);padding:12px 15px;margin:10px 0;}
  .world .wl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--good);font-weight:700;}
  .world p{font-size:16px;margin:5px 0;}
  .gate{font-family:var(--mono);font-size:11px;color:var(--rust);text-align:right;margin-top:6px;}
  table.log{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px;}
  table.log th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);text-align:left;border-bottom:1px solid var(--line);padding:6px;}
  table.log td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top;}
  table.log tr.empty td{color:#a99c80;font-style:italic;}
  table.log td.ok{font-family:var(--mono);font-size:11px;color:var(--good);font-weight:700;}

  .cards4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0;}
  .scard{border:1px solid var(--line);background:var(--paper);padding:12px 14px;}
  .scard .st{font-weight:600;font-size:17px;}
  .scard .sm{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin:3px 0 8px;line-height:1.5;}
  .scard textarea{width:100%;min-height:52px;font-family:var(--serif);font-size:15.5px;border:1px solid var(--line);background:#fffdf7;padding:6px 8px;resize:vertical;}
  .radial{border:1px solid var(--line);background:radial-gradient(circle at 50% 46%,#fbf7ec,#efe8d6);margin:8px 0;}
  .radial svg{display:block;width:100%;height:auto;}
  .radial [data-i]{cursor:pointer;} .radial [data-i]:hover{opacity:.7;}

  .kqcard{border:1px solid var(--line);background:var(--paper);padding:12px 15px;margin:10px 0;border-left:4px solid var(--blue);}
  .kqcard .kh{font-size:18px;font-weight:600;}
  .kqcard .kc{font-size:15.5px;color:var(--ink-soft);margin-top:4px;}
  .kqcard .kc b{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-right:4px;}
  .kqcard .cut{display:none;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:15.5px;}
  .kqcard .cut.shown{display:block;}
  .kqcard button{margin-top:8px;}
  .stepsbig{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px;}
  .stepsbig div{border:1px solid var(--blue-2);background:rgba(58,98,156,.05);padding:9px 11px;font-size:15.5px;}
  .stepsbig div b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);display:block;}
  .hint{display:none;border-left:3px solid var(--amber);padding:6px 12px;margin:6px 0;font-size:16px;background:rgba(176,125,24,.05);}
  .hint.shown{display:block;}

  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;}
  .btn{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:11px 22px;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;border-radius:2px;transition:.15s;}
  .btn:hover{background:var(--blue-2);}
  .btn.ghost{background:transparent;color:var(--blue);} .btn.ghost:hover{background:rgba(31,63,110,.07);}
  .btn.go{background:var(--good);border-color:var(--good);}
  .btn.sm{font-size:11px;padding:8px 14px;}
  .btn:disabled{opacity:.3;cursor:not-allowed;}
  .done-card{border:1px solid var(--line);background:rgba(176,125,24,.06);padding:16px 18px;margin-top:16px;}
  .done-card .dl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);}
  .done-card .db{font-size:17px;margin-top:4px;}
  .footnote{font-family:var(--mono);font-size:10px;color:var(--ink-soft);text-align:center;margin-top:26px;letter-spacing:.04em;}
  @media(max-width:700px){.two,.three,.cards4,.readout,.split,.stepsbig{grid-template-columns:1fr;} header.pin{position:relative;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="pin">
    <h1>Settled Science? How Science Changes Its Mind</h1>
    <div class="kq"><b>KQ</b>How does science change its mind — and how settled is &ldquo;settled science&rdquo;?</div>
    <div class="tags"><span class="tag">Evidence</span><span class="tag">Certainty</span><span class="tag">Explanation</span><span class="tag">Truth</span><span class="tag fw">Scope</span><span class="tag fw">Perspectives</span><span class="tag fw">Methods &amp; tools</span></div>
  </header>
  <div class="dots" id="dots"></div>
  <div class="stepname" id="stepname"></div>
  <div id="screens"></div>
  <div class="footnote">TOK · Natural Sciences · Lesson 5 — when you see NOTEBOOK TIME, stop and write</div>
</div>

<script>
(function(){
"use strict";
var $=function(s,el){return (el||document).querySelector(s);};
var $$=function(s,el){return [].slice.call((el||document).querySelectorAll(s));};
function show(el){ if(el) el.classList.add("shown"); }
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ---------- notebook time ---------- */
function notebook(min, q, extra){
  return '<div class="nb-time" data-min="'+min+'"><div class="nbh"><span>✎ Notebook time · stop and write</span><span class="tm"><span class="clock">'+min+':00</span><button data-timer>Start '+min+' min</button></span></div>'+
    '<div class="nbb"><div class="q">'+q+'</div>'+(extra||'')+'</div></div>';
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-timer]"); if(!b) return;
  var panel=b.closest(".nb-time"), clock=$(".clock",panel), secs=(+panel.dataset.min)*60;
  if(panel._iv){ clearInterval(panel._iv); }
  panel.classList.remove("done"); b.textContent="Restart";
  function tick(){ var m=Math.floor(secs/60), s=secs%60; clock.textContent=m+":"+(s<10?"0":"")+s;
    if(secs<=0){ clearInterval(panel._iv); clock.textContent="Pens down"; panel.classList.add("done"); } secs--; }
  tick(); panel._iv=setInterval(tick,1000);
});

/* ---------- opening sort ---------- */
var SORT=[
  {id:"apple", t:"A dropped apple falls to the ground.", k:"obs"},
  {id:"pull",  t:"Gravity is a pull between masses.", k:"th"},
  {id:"merc",  t:"Mercury’s orbit swings round a little further every century.", k:"obs"},
  {id:"bend",  t:"Mass bends space and time.", k:"th"},
  {id:"star",  t:"Starlight passing close to the Sun is bent.", k:"obs"},
  {id:"bh",    t:"Nothing that falls into a black hole can ever send a signal back out.", k:"th"}
];
var SORTANS={};
function sortHTML(locked){
  return SORT.map(function(s){
    var a=SORTANS[s.id];
    return '<div class="sortrow" data-s="'+s.id+'"><div class="st">'+s.t+'<span class="kind '+s.k+'">'+(s.k==="obs"?"Observation":"Theory")+'</span></div>'+
      (locked? '<div class="opt small'+(a?' picked':'')+'" style="cursor:default">'+(a==="could"?"Could change":a==="wont"?"Won’t change":"—")+'</div>'
      : '<div class="opts"><button class="opt small'+(a==="could"?' picked':'')+'" data-a="could">Could change</button><button class="opt small'+(a==="wont"?' picked':'')+'" data-a="wont">Won’t change</button></div>')+'</div>';
  }).join("");
}

/* ---------- stage machinery ---------- */
var stages=[], idx=0, stageEls=[];
function addStage(name,build,gate){stages.push({name:name,build:build,gate:gate||null});}
function navHTML(next){ return '<div class="nav"><button class="btn ghost" data-back>← Back</button>'+(next?'<button class="btn" data-next>'+next+' →</button>':'<span></span>')+'</div><div class="gate" data-gatemsg></div>'; }
function wireNav(el){ var b=$("[data-back]",el), n=$("[data-next]",el); if(b) b.onclick=function(){go(idx-1);}; if(n) n.onclick=function(){go(idx+1);}; }
function canLeave(i){ var g=stages[i].gate; return !g || g(); }
function updateGates(){
  stageEls.forEach(function(el,i){ var n=$("[data-next]",el), m=$("[data-gatemsg]",el); if(!n) return;
    var ok=canLeave(i); n.disabled=!ok; if(m) m.textContent= ok? "" : "Finish the lab and click “Check against the world” to unlock Next."; });
  $$(".dot").forEach(function(d,j){ var locked=false; for(var k=0;k<j;k++){ if(!canLeave(k)) locked=true; } d.classList.toggle("locked",locked); });
}
var anims={};
function stopAnims(){ Object.keys(anims).forEach(function(k){ if(anims[k].stop) anims[k].stop(); }); }

/* ======================= STAGE 1 · Commit ======================= */
addStage("Commit", function(el){

  world:'<p><b>Lab bench, 33 cm (NIST, USA, 2010):</b> the higher of two atomic clocks ran faster by the predicted amount, about 90 billionths of a second over an 80-year life.</p><p><b>Tokyo Skytree, 450 m (Japan, 2020):</b> a portable clock on the observation deck ran faster than one at the base, by the predicted amount.</p><p><b>GPS, every day:</b> height makes satellite clocks gain about 45 millionths of a second a day; their speed makes them lose about 7. Net: about 38. Engineers set the clocks to tick slightly slow before launch. Without that, your phone’s map would drift about 10 km a day.</p>',

    '<p class="body" style="font-size:15.5px;color:var(--ink-soft)">LIGO has two detectors about 3,000 km apart: Hanford, Washington, and Livingston, Louisiana. Each uses lasers to measure a change in length far smaller than a proton. Ordinary things near one detector, like traffic or a small earthquake, can also shake it.</p>',
  record:["Describe the black-hole signal. What happens just before the merger?","What is different about the local shaking?","Why does having two detectors far apart make the evidence stronger?"],
  world:'<p><b>14 September 2015:</b> both LIGO detectors recorded the same rising chirp, Livingston about 7 thousandths of a second before Hanford, the right gap for a ripple crossing the USA at light speed. Its shape matched what the theory predicts for two black holes, each about 30 times the mass of the Sun, merging about 1.3 billion light-years away. Predicted 1916, detected 2015.</p><p>Since then, LIGO and partner detectors have recorded many more mergers.</p>',
  couldno:"Yes. Nothing, or a signal with a different shape, would have counted against the theory. And a signal in only one detector gets thrown out as local shaking.",
  build:function(p){

    function chirp(t){ if(t<0) return 0; if(t<Tm){ var tau=Tm-t; var a=0.07/Math.pow(tau+0.004,0.25); return a*Math.cos(2*Math.PI*10.5*Math.pow(tau+0.004,0.625)); } var dt=t-Tm; return 0.28*Math.exp(-dt*60)*Math.cos(2*Math.PI*60*dt); }
    function noise(){ return (Math.random()-.5)*0.05; }
    function local(t,c){ var env=Math.exp(-Math.pow((t-c)/0.13,2)); return env*(0.12*Math.sin(2*Math.PI*11*t)+0.07*Math.sin(2*Math.PI*4*t+1)); }
    function trace(arr,y0,label,col,upto){ ctx.fillStyle="rgba(203,191,159,.85)"; ctx.font="11px JetBrains Mono, monospace"; ctx.fillText(label,12,y0-46);

      ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.beginPath(); for(var i=0;i<upto;i++){ var x=10+(W-20)*i/N, y=y0-arr[i]*90; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); } ctx.stroke(); }
    function draw(){
      ctx.fillStyle="#141a26"; ctx.fillRect(0,0,W,H); var t=prog/N, ox=W/2, oy=70;

          for(var r=1;r<6;r++){ ctx.strokeStyle="rgba(202,162,74,"+(0.22-r*0.035)+")"; ctx.beginPath(); ctx.arc(ox,oy,sep+r*22+((prog*2)%22),0,7); ctx.stroke(); }
          [0,Math.PI].forEach(function(o,j){ ctx.fillStyle="#000"; ctx.strokeStyle="#caa24a"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(ox+Math.cos(ph+o)*sep*(j?1.15:0.9),oy+Math.sin(ph+o)*sep*0.35*(j?1.15:0.9),j?11:12,0,7); ctx.fill(); ctx.stroke(); });
        } else { ctx.fillStyle="#000"; ctx.strokeStyle="#caa24a"; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(ox,oy,17,0,7); ctx.fill(); ctx.stroke();
          for(var r2=1;r2<5;r2++){ ctx.strokeStyle="rgba(202,162,74,"+(0.35-r2*0.07)+")"; ctx.beginPath(); ctx.arc(ox,oy,17+r2*14+(prog-Tm*N)*1.5,0,7); ctx.stroke(); } }
        ctx.fillStyle="rgba(203,191,159,.85)"; ctx.font="11px JetBrains Mono, monospace"; ctx.fillText("1.3 BILLION LIGHT-YEARS AWAY",12,20);
      } else if(mode==="local"){ ctx.fillStyle="rgba(230,180,127,.85)"; ctx.font="12px JetBrains Mono, monospace"; ctx.textAlign="center"; ctx.fillText("ground shaking near the Hanford detector only",ox,oy+4); ctx.textAlign="left";
      } else { ctx.fillStyle="rgba(203,191,159,.6)"; ctx.font="12px JetBrains Mono, monospace"; ctx.textAlign="center"; ctx.fillText("press a ▶ button",ox,oy+4); ctx.textAlign="left"; }
      var upto=Math.min(prog,N); trace(sigL,210,"LIVINGSTON, LOUISIANA","#7fb0e6",upto); trace(sigH,312,"HANFORD, WASHINGTON","#e6b47f",upto);
    }
    function step(){ prog+=3; draw(); if(prog<N) raf=requestAnimationFrame(step); }
    function run(m){ cancelAnimationFrame(raf); mode=m; prog=0; sigL=[]; sigH=[]; var c=0.4+Math.random()*0.2;

    $("#gwGo",p).onclick=function(){ run("merge"); }; $("#gwLocal",p).onclick=function(){ run("local"); };
    $("#gwClear",p).onclick=function(){ cancelAnimationFrame(raf); mode=null; prog=0; sigL=sigH=null; draw(); }; draw();
  }
});

  {q:"Is a theory that has been shown to be wrong still knowledge?",
   cases:"Newton · phrenology · Newton’s cannon and Mercury",
   cut:"Wrong outside its scope (Newton still gives the right answers for bridges and rockets) vs wrong at its core (the skull bumps never tracked anything). Second cut: a map can be useful without being the territory, but useful isn’t the same as true."},
  {q:"Why do many sources agreeing sometimes make a claim strong, and sometimes not?",
   cases:"The four labs · bixonimania",
   cut:"Independent lines (different tools, teams, decades) vs many lines that all trace back to one source. Second cut: each line also has to be able to say no. Lines that could never disagree add nothing."},
  {q:"Is the centre of a black hole a “never”?",
   cases:"The shadow lab · observation vs theory · Newton to Einstein",
   cut:"Never according to our best theory vs never, full stop. The “never” comes from the theory, not from an observation, and the centre is where physicists expect the theory to break. Second cut: the laws of nature vs our theory of the laws. Nature may not change; our map of it does."}];
addStage("Make it, break it", function(el){
  el.innerHTML=
  '<div class="micro">Part 6 · Claims and cuts</div><h2>Make it. Back it. Break it. Cut it.</h2>'+
  '<div class="lens">Knowledge claims about knowledge</div>'+
  '<div class="stepsbig"><div><b>1 · Make it</b>Answer the question in one sentence. That is your knowledge claim.</div><div><b>2 · Back it</b>Support it with a case from today. Name the case.</div><div><b>3 · Break it</b>Find a case where your claim stops working.</div><div><b>4 · Cut it</b>Rewrite the claim so it holds. Say where it holds and where it stops.</div></div>'+
  '<p class="body"><b>Pairs: choose two of these four questions.</b></p>'+
  SUBS.map(function(s,i){ return '<div class="kqcard"><div class="kh">'+(i+1)+'. '+s.q+'</div><div class="kc"><b>Cases to try</b>'+s.cases+'</div><button class="btn sm ghost" data-cut="'+i+'">Show a cut (teacher)</button><div class="cut" id="cut'+i+'">'+s.cut+'</div></div>'; }).join("")+
  notebook(10,"Your two questions: make it, back it, break it, cut it.","<div class=\"use\">One short paragraph each. The break is the important part.</div>")+
  '<div class="sec"><h3><span class="n">★</span>Everyone: do observations ever change?</h3>'+
  '<p>At the end of Part 5 we said: <b>“The observations stay. Only the theory changes.”</b> Test it.</p>'+
  '<div class="talk"><div class="tl">Make it</div><div class="tb">Agree or disagree, in one sentence. Then test your sentence against these four cases.</div></div>'+
  '<div class="two">'+
    '<div class="mini"><div class="ml">The equipment</div>Ripples from colliding black holes were passing through the Earth long before 2015. Why was there no observation of them until then?</div>'+
    '<div class="mini"><div class="ml">How sensitive it is</div>A clock 33 cm higher ran faster in Newton’s time too. Instruments sensitive enough to see effects like this didn’t exist until the late 1950s. Was it an observation before then?</div>'+
    '<div class="mini"><div class="ml">What the knower is looking for</div>The matching coastlines and fossils of Africa and South America were seen for a long time. When did they become <span class="cc">evidence</span>, and what changed: the rocks, or the knowers?</div>'+
    '<div class="mini"><div class="ml">A mistake</div>In 2011 the OPERA experiment measured particles called neutrinos travelling faster than light. Months later the cause was found: a loose fibre-optic cable. What caught the mistake?</div>'+
  '</div>'+
  '<div class="talk"><div class="tl">Break it</div><div class="tb">So what changes: the world, or the observation? Where does your sentence stop working?</div></div>'+
  '<button class="btn sm ghost" id="obsCut">Show a cut (after you’ve talked)</button>'+
  '<div class="block" id="obsCutBlk"><div class="nameit"><div class="nl">The cut — the world vs what we can observe of it</div><div class="nb">'+
    '<p>Nature doesn’t change because we look at it. But <em>observations</em> do. They depend on the <span class="cc">tools</span> (no detector, no ripple), on how sensitive the tools are (no atomic clock, no time difference), and on what the knower is looking for: whether they recognise something as <span class="cc">evidence</span> at all (the coastlines). And a single observation can simply be wrong (OPERA).</p>'+
    '<p>So: observations that many independent tools keep finding are very hard to overturn. But what counts as an observation, and as evidence, grows with new tools and new frameworks.</p></div></div></div>'+
  '<div class="talk"><div class="tl">Bridge to the Knowledge Question</div><div class="tb">So what could <b>cause</b> science to change its mind, and what could <b>prevent</b> it? Name a case for each.</div></div>'+
  '<button class="btn sm ghost" id="causeCut">Show some answers (teacher)</button>'+
  '<div class="block" id="causeBlk"><div class="two">'+
    '<div class="mini obs"><div class="ml">Could cause a change</div>A new or more sensitive tool opens a gap (Mercury’s 43″, LIGO). A new theory explains all the observations, old and new (Einstein). Someone recognises something as evidence (the coastlines, once drift had a mechanism). Independent checks catch a mistake (OPERA).</div>'+
    '<div class="mini th"><div class="ml">Could prevent a change</div>No tool can reach it (the centre of a black hole). The framework doesn’t recognise it as evidence (fixed continents). Explaining it away (Vulcan, phrenology). No rival theory to switch to (Le Verrier had nothing to replace Newton with).</div>'+
  '</div></div>'+
  '</div>'+
  '<div class="sec"><h3><span class="n">★</span>Everyone: the Knowledge Question</h3></div>'+
  notebook(8,"How does science change its mind — and how settled is “settled science”?",
    "<ul><li>Give your answer. Back it with cases from today.</li><li>Break it with what you found in your two questions and in the observations question.</li><li>Say what could cause science to change its mind, and what could prevent it.</li><li>Finish by saying how much of your answer is still standing.</li><li>Your answer has to hold two things at once: settled science is <b>not permanent</b>, but it is <b>not just opinion</b> either.</li></ul>"+
    "<div class=\"use\">Use at least two: evidence · certainty · explanation · truth · perspective · scope. A clear cut, well supported, can earn a B. A second cut, or a “but” that limits the first, can earn an A.</div>")+
  '<div class="talk"><div class="tl">Look back</div><div class="tb">Compare this answer with your one-sentence answer from the start. What changed?</div></div>'+
  '<div class="done-card"><div class="dl">Next lesson</div><div class="db"><b>To which knowers is science settled?</b> The scientists who can see the lines? You, after today? Someone watching a 50/50 debate on TV? You’ll pick a claim people argue about and check how much independent convergence it really has.</div></div>'+
  navHTML(null);
  wireNav(el);
  $$("[data-cut]",el).forEach(function(b){ b.onclick=function(){ $("#cut"+b.dataset.cut,el).classList.toggle("shown"); }; });
  $("#obsCut",el).onclick=function(){ show($("#obsCutBlk",el)); this.style.display="none"; };
  $("#causeCut",el).onclick=function(){ show($("#causeBlk",el)); this.style.display="none"; };
});

/* ======================= boot ======================= */
var dotsWrap=$("#dots"), stepname=$("#stepname"), screens=$("#screens");
stages.forEach(function(def,i){ var sec=document.createElement("section"); sec.className="stage"; screens.appendChild(sec); stageEls.push(sec);
  var d=document.createElement("div"); d.className="dot"; d.title=def.name; d.onclick=function(){ for(var k=0;k<i;k++){ if(!canLeave(k)) return; } go(i); }; dotsWrap.appendChild(d); });
function go(i){
  if(i<0||i>=stages.length) return;
  if(i>idx && !canLeave(idx)) return;
  stopAnims(); idx=i;
  stageEls.forEach(function(s,j){ s.classList.toggle("show",j===i); if(j===i&&!s.dataset.built){ stages[j].build(s); s.dataset.built="1"; } });
  if(stages[i].onShow) stages[i].onShow(stageEls[i]);
  $$(".dot").forEach(function(d,j){ d.classList.toggle("active",j===i); d.classList.toggle("done",j<i); });
  stepname.textContent=(i+1)+" / "+stages.length+" · "+stages[i].name;
  refreshLogs(); updateGates();
  window.scrollTo({top:0,behavior:"smooth"});
}
var hdr=$("header.pin"); window.addEventListener("scroll",function(){ var y=window.scrollY; if(y>180) hdr.classList.add("slim"); else if(y<20) hdr.classList.remove("slim"); });
go(0);
})();
