<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settled Science? How Science Changes Its Mind — TOK Natural Sciences L5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4efe2; --paper-2:#efe8d6; --ink:#2a2622; --ink-soft:#5a5145;
    --blue:#1f3f6e; --blue-2:#3a629c; --amber:#b07d18; --amber-2:#caa24a; --rust:#8a3b2a;
    --line:#cbbf9f; --good:#3f6b3a; --space:#141a26;
    --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    --mono:"JetBrains Mono","Courier New",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--serif); color:var(--ink); background:var(--paper);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(176,125,24,.05), transparent 40%),
      radial-gradient(circle at 82% 88%, rgba(31,63,110,.05), transparent 42%),
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(120,108,80,.035) 27px, rgba(120,108,80,.035) 28px);
    line-height:1.45; -webkit-font-smoothing:antialiased; padding:24px 16px 90px;
  }
  .wrap{max-width:900px;margin:0 auto;}
  header.pin{border:1px solid var(--line); background:linear-gradient(180deg,var(--paper-2),var(--paper));
    padding:16px 20px 14px; box-shadow:0 1px 0 #fff inset, 0 6px 18px rgba(40,34,26,.06); position:sticky; top:0; z-index:5;}
  header.pin::before{content:"NATURAL SCIENCES · LESSON 5"; font-family:var(--mono); font-size:10px;
    letter-spacing:.22em; color:var(--amber); display:block; margin-bottom:6px;}
  header.pin h1{font-size:28px;font-weight:600;margin:0 0 4px;letter-spacing:.01em;line-height:1.05;}
  .kq{font-style:italic;color:var(--blue);font-size:18px;margin:2px 0 10px;}
  .kq b{font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.16em;color:var(--amber);margin-right:6px;}
  .tags{display:flex;gap:8px;flex-wrap:wrap;}
  .tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    border:1px solid var(--blue-2);color:var(--blue);border-radius:2px;padding:3px 8px;background:rgba(58,98,156,.06);}
  .tag.fw{border-color:var(--amber);color:var(--amber);background:rgba(176,125,24,.06);}

  .dots{display:flex;gap:7px;align-items:center;justify-content:center;margin:18px 0 6px;flex-wrap:wrap;}
  .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--blue-2);background:transparent;transition:.25s;cursor:pointer;}
  .dot.active{background:var(--amber);border-color:var(--amber);transform:scale(1.25);}
  .dot.done{background:var(--blue-2);}
  .stepname{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:14px;}

  .stage{display:none;border:1px solid var(--line);background:rgba(255,253,247,.6);
    padding:26px 26px 28px;box-shadow:0 8px 30px rgba(40,34,26,.07);animation:rise .4s ease;}
  .stage.show{display:block;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .stage h2{font-size:26px;font-weight:600;margin:0 0 4px;}
  .stage h3{font-size:21px;font-weight:600;margin:22px 0 4px;}
  .lead{color:var(--ink-soft);font-size:17px;margin:0 0 14px;}
  p.body{font-size:17px;margin:8px 0;}
  .micro{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin:0 0 4px;}
  .cc{font-variant:small-caps;color:var(--blue);font-weight:600;letter-spacing:.03em;}
  .lens{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--amber);border:1px solid var(--amber);padding:3px 9px;margin:4px 0 14px;background:rgba(176,125,24,.05);}

  /* ranking */
  .scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;margin:0 2px 8px;}
  .scale b{color:var(--rust);} .scale span:last-child b{color:var(--good);}
  ol.rank{list-style:none;margin:0;padding:0;}
  ol.rank li{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--paper);
    margin:7px 0;padding:11px 12px;cursor:grab;transition:.15s;border-left:4px solid var(--blue-2);}
  ol.rank li.drag{opacity:.45;}
  ol.rank li .num{font-family:var(--mono);font-weight:700;color:var(--blue);min-width:20px;}
  ol.rank li .claim{flex:1;font-size:17px;}
  ol.rank li .ctl{display:flex;flex-direction:column;gap:2px;}
  ol.rank li .ctl button{font-family:var(--mono);border:1px solid var(--line);background:var(--paper-2);
    color:var(--blue);cursor:pointer;width:26px;height:18px;line-height:1;font-size:11px;border-radius:2px;}
  ol.rank li .ctl button:hover{background:var(--amber-2);color:#fff;}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .compare h4{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px;}
  ol.prev{list-style:none;margin:0;padding:0;}
  ol.prev li{border:1px solid var(--line);background:var(--paper-2);margin:7px 0;padding:11px 12px;font-size:15.5px;color:var(--ink-soft);}

  /* blocks & reveals */
  .block{margin:14px 0;display:none;}
  .block.shown{display:block;animation:rise .4s ease;}
  .prompt{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;}
  .qline{font-size:17px;color:var(--blue);font-style:italic;margin-bottom:8px;}
  .opts{display:flex;gap:9px;flex-wrap:wrap;}
  .opt{font-family:var(--mono);font-size:12px;letter-spacing:.03em;border:1px solid var(--blue-2);background:var(--paper);
    color:var(--blue);padding:9px 14px;cursor:pointer;border-radius:2px;transition:.15s;}
  .opt:hover{background:var(--blue);color:#fff;}
  .opt.picked{background:var(--blue);color:#fff;}
  .opt.dim{opacity:.4;}
  .opt.small{font-size:11px;padding:6px 10px;}
  .fb{font-size:16px;margin-top:8px;padding:9px 12px;border-left:4px solid var(--blue-2);background:rgba(58,98,156,.06);}

  .nameit{border:1px solid var(--blue-2);border-left:5px solid var(--amber);background:rgba(58,98,156,.05);padding:14px 16px;margin:10px 0;}
  .nameit .nl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:700;}
  .nameit .nb{font-size:16.5px;margin-top:6px;}
  .nameit .nb p{margin:6px 0;}
  .nameit .nb em{color:var(--blue);font-style:italic;}

  .talk{border:1px solid var(--line);background:var(--paper);padding:12px 16px;margin:12px 0;}
  .talk .tl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-2);font-weight:700;}
  .talk .tb{font-size:17px;margin-top:3px;}
  .note{border:2px dashed var(--amber);background:rgba(176,125,24,.07);padding:12px 16px;margin:12px 0;}
  .note .hl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700;}
  .note .hb{font-size:17px;margin-top:3px;}
  .note ul{margin:6px 0 0 0;padding-left:20px;font-size:16.5px;}

  .pg{border:1px solid var(--line);background:#f7f2e6;padding:14px 18px 12px;position:relative;box-shadow:0 4px 14px rgba(40,34,26,.08);margin:10px 0;}
  .pg .yr{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--rust);}
  .pg .src{font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);margin-bottom:4px;letter-spacing:.06em;}
  .pg p{font-size:16.5px;margin:6px 0;}

  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0;}
  .mini{border:1px solid var(--line);background:var(--paper);padding:11px 13px;font-size:15.5px;}
  .mini .ml{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;}
  .mini .mx{font-family:var(--mono);font-size:10.5px;color:var(--rust);margin-top:6px;}
  .mini.obs{border-left:4px solid var(--good);} .mini.th{border-left:4px solid var(--amber);}
  .pos{border:1px solid var(--line);background:var(--paper);padding:12px 14px;margin:8px 0;}
  .pos .ph{font-weight:600;font-size:17px;}
  .pos .ps{font-size:15.5px;margin-top:4px;}
  .pos .ps b{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-right:4px;}
  .pos.mine{border-color:var(--blue);box-shadow:0 0 0 2px rgba(31,63,110,.15);}

  /* labs */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0;}
  .tab{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;border:1px solid var(--line);border-bottom:none;background:var(--paper-2);
    color:var(--ink-soft);padding:9px 13px;cursor:pointer;border-radius:3px 3px 0 0;}
  .tab.on{background:#fffdf7;color:var(--blue);border-color:var(--blue-2);font-weight:700;}
  .tab .tk{color:var(--good);margin-left:5px;display:none;} .tab.logged .tk{display:inline;}
  .labpanel{display:none;border:1px solid var(--blue-2);background:#fffdf7;padding:18px 18px 16px;}
  .labpanel.on{display:block;}
  .pred{border-left:4px solid var(--blue-2);background:rgba(58,98,156,.06);padding:10px 14px;font-size:16.5px;margin:0 0 12px;}
  .pred b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-2);display:block;margin-bottom:2px;}
  .stagebox{background:var(--space);border:1px solid #2c3446;border-radius:2px;position:relative;margin:10px 0;}
  .stagebox canvas, .stagebox svg{display:block;width:100%;height:auto;}
  .ctrls{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;margin:10px 0;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);}
  .ctrls input[type=range]{width:100%;accent-color:var(--blue);}
  .ctrls .val{color:var(--blue);font-weight:700;min-width:120px;text-align:right;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0;}
  .chk{font-family:var(--mono);font-size:11.5px;color:var(--ink);display:inline-flex;gap:6px;align-items:center;cursor:pointer;}
  .chk input{accent-color:var(--amber);}
  .readout{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
  .ro{border:1px solid var(--line);background:var(--paper);padding:10px 12px;}
  .ro .rl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);}
  .ro .rv{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--blue);margin-top:3px;}
  .ro .rs{font-size:14.5px;color:var(--ink-soft);margin-top:2px;}
  .ro.newton .rv{color:var(--rust);}
  .world{border:1px solid var(--good);background:rgba(63,107,58,.07);padding:12px 15px;margin:10px 0;}
  .world .wl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--good);font-weight:700;}
  .world p{font-size:16px;margin:5px 0;}

  table.log{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px;}
  table.log th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);text-align:left;border-bottom:1px solid var(--line);padding:6px 6px;}
  table.log td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top;}
  table.log tr.empty td{color:#a99c80;font-style:italic;}
  table.log td.ok{font-family:var(--mono);font-size:11px;color:var(--good);font-weight:700;}

  /* sceptic */
  .cards4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0;}
  .scard{border:1px solid var(--line);background:var(--paper);padding:12px 14px;}
  .scard .st{font-weight:600;font-size:17.5px;}
  .scard .sm{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin:3px 0 8px;line-height:1.5;}
  .scard textarea{width:100%;min-height:56px;font-family:var(--serif);font-size:15.5px;border:1px solid var(--line);background:#fffdf7;padding:6px 8px;resize:vertical;}
  .xrow{border:1px solid var(--line);background:var(--paper);padding:10px 13px;margin:8px 0;}
  .xrow .xq{font-size:16px;}
  .xrow .xq i{color:var(--blue);}
  .xrow .xc{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;}
  .xrow .tally{font-family:var(--mono);font-size:11px;color:var(--rust);margin-top:6px;}
  .counter{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--rust);text-align:center;padding:10px;border:1px solid var(--rust);background:rgba(138,59,42,.07);margin:10px 0;}

  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;}
  .btn{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    padding:11px 22px;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;border-radius:2px;transition:.15s;}
  .btn:hover{background:var(--blue-2);}
  .btn.ghost{background:transparent;color:var(--blue);} .btn.ghost:hover{background:rgba(31,63,110,.07);}
  .btn.go{background:var(--good);border-color:var(--good);}
  .btn.sm{font-size:11px;padding:8px 14px;}
  .btn:disabled{opacity:.3;cursor:not-allowed;}
  .done-card{border:1px solid var(--line);background:rgba(176,125,24,.06);padding:16px 18px;margin-top:16px;text-align:center;}
  .done-card .dl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);}
  .done-card .db{font-size:17px;margin-top:4px;}
  .footnote{font-family:var(--mono);font-size:10px;color:var(--ink-soft);text-align:center;margin-top:26px;letter-spacing:.04em;}
  header.pin.slim{padding:8px 20px 6px;} header.pin.slim::before, header.pin.slim h1, header.pin.slim .tags{display:none;} header.pin.slim .kq{margin:0;font-size:16px;}
  @media(max-width:680px){.compare,.two,.three,.cards4,.readout{grid-template-columns:1fr;} header.pin{position:relative;}}
</style>

<body>
<div class="wrap">
  <header class="pin">
    <h1>Settled Science? How Science Changes Its Mind</h1>
    <div class="kq"><b>KQ</b>How does science change its mind — and how settled is &ldquo;settled science&rdquo;?</div>
    <div class="tags"><span class="tag">Evidence</span><span class="tag">Certainty</span><span class="tag">Explanation</span><span class="tag">Truth</span><span class="tag fw">Scope</span><span class="tag fw">Perspectives</span><span class="tag fw">Methods &amp; tools</span></div>
  </header>
  <div class="dots" id="dots"></div>
  <div class="stepname" id="stepname"></div>
  <div id="screens"></div>
  <div class="footnote">TOK · Natural Sciences · Lesson 5 — record your answers in your notebook as you go</div>
</div>

<script>
(function(){
"use strict";
var $=function(sel,el){return (el||document).querySelector(sel);};
var $$=function(sel,el){return [].slice.call((el||document).querySelectorAll(sel));};
function show(el){ if(el) el.classList.add("shown"); }

/* ================= ranking ================= */
var CARDS=[
  {id:"light", text:"Gravity bends light"},
  {id:"desc",  text:"All living things share a common ancestry"},
  {id:"plate", text:"The continents move across the Earth’s surface"},
  {id:"chol",  text:"Eating cholesterol raises your risk of heart disease"},
  {id:"string",text:"String theory describes the smallest parts of matter"}
];
var round1=null;
function makeRankList(ol, order){
  ol.innerHTML="";
  order.forEach(function(c){
    var li=document.createElement("li"); li.setAttribute("draggable","true"); li.dataset.id=c.id;
    li.innerHTML='<span class="num"></span><span class="claim">'+c.text+'</span><span class="ctl"><button data-up>▲</button><button data-down>▼</button></span>';
    ol.appendChild(li);
  });
  renumber(ol);
  ol.addEventListener("click",function(e){
    var li=e.target.closest("li"); if(!li) return;
    if(e.target.hasAttribute("data-up")&&li.previousElementSibling){ol.insertBefore(li,li.previousElementSibling);renumber(ol);}
    if(e.target.hasAttribute("data-down")&&li.nextElementSibling){ol.insertBefore(li.nextElementSibling,li);renumber(ol);}
  });
  var dragged=null;
  ol.addEventListener("dragstart",function(e){var li=e.target.closest("li");if(!li)return;dragged=li;li.classList.add("drag");});
  ol.addEventListener("dragend",function(){if(dragged){dragged.classList.remove("drag");dragged=null;}renumber(ol);});
  ol.addEventListener("dragover",function(e){e.preventDefault();var li=e.target.closest("li");if(!li||li===dragged||!dragged)return;
    var r=li.getBoundingClientRect();ol.insertBefore(dragged,(e.clientY-r.top)/r.height>0.5?li.nextElementSibling:li);});
}
function renumber(ol){ $$("li",ol).forEach(function(li,i){ $(".num",li).textContent=i+1; }); }
function readOrder(ol){ return $$("li",ol).map(function(li){ return CARDS.filter(function(c){return c.id===li.dataset.id;})[0]; }); }

/* ================= stages ================= */
var stages=[]; function addStage(name,build){stages.push({name:name,build:build});}
var idx=0, stageEls=[];
function navHTML(nextLabel){ return '<div class="nav"><button class="btn ghost" data-back>← Back</button>'+(nextLabel?'<button class="btn" data-next>'+nextLabel+' →</button>':'<span></span>')+'</div>'; }
function wireNav(el){ var b=$("[data-back]",el), n=$("[data-next]",el); if(b) b.onclick=function(){go(idx-1);}; if(n) n.onclick=function(){go(idx+1);}; }

/* ---- 1. Commit ---- */
addStage("Commit", function(el){
  el.innerHTML=
  '<div class="micro">Start · Commit first</div>'+
  '<h2>How settled is it?</h2>'+
  '<div class="note"><div class="hl">✎ Notebook</div><div class="hb">Answer the Knowledge Question in one sentence, off the top of your head. Don’t cross it out later.</div></div>'+
  '<div class="talk"><div class="tl">Last class, some of you said</div><div class="tb">“Maybe Einstein was wrong. There will be another paradigm shift.” Hands up: agree or disagree? Don’t argue yet. Hold your answer.</div></div>'+
  '<p class="lead">Now rank these five claims. Gut instinct, no looking anything up.</p>'+
  '<div class="scale"><span><b>TOP</b> — most likely to change</span><span><b>BOTTOM</b> — most settled</span></div>'+
  '<ol class="rank" id="rank1"></ol>'+
  '<div class="note"><div class="hl">✎ Notebook</div><div class="hb">Write down the claim you put at the bottom. Why does it feel settled to you? What is that feeling based on?</div></div>'+
  '<div class="nav"><span></span><button class="btn" id="lockBtn">Lock my ranking →</button></div>';
  var ol=$("#rank1",el); makeRankList(ol,CARDS.slice());
  $("#lockBtn",el).onclick=function(){ round1=readOrder(ol); go(idx+1); };
});

/* ---- 2. Newton's anomalies ---- */
addStage("Newton’s framework", function(el){
  el.innerHTML=
  '<div class="micro">Part 1 · When the evidence doesn’t fit</div>'+
  '<h2>Two planets that didn’t fit Newton</h2>'+
  '<div class="lens">Perspective · seeing from inside a framework</div>'+
  '<div class="pg"><div class="yr">1846 · NEPTUNE</div><div class="src">YOU MET THIS ONE IN LESSON 1</div>'+
    '<p>For over 150 years, Newton’s law of gravity predicted the planets almost perfectly. Then Uranus drifted off its predicted path.</p>'+
    '<p>The French astronomer Urbain Le Verrier did not throw Newton out. He asked: what if a planet nobody can see is pulling on Uranus? He calculated where it had to be. On 23 September 1846, Johann Galle pointed a telescope at that spot and found Neptune, about one degree from the prediction.</p>'+
    '<p>The <span class="cc">method</span>: when the <span class="cc">evidence</span> doesn’t fit, look for something missing inside the theory — and make a prediction that could fail.</p></div>'+
  '<div class="pg"><div class="yr">1859 · MERCURY</div><div class="src">LE VERRIER, AGAIN</div>'+
    '<p>Le Verrier then studied Mercury. Its orbit slowly swings around the Sun, and it swings a tiny bit faster than Newton’s law allows. He counted every planet and every known pull. The gap would not go away.</p></div>'+
  '<div class="prompt">Predict</div><div class="qline">You are Le Verrier in 1859. What do you do?</div>'+
  '<div class="opts" id="lvOpts">'+
    '<button class="opt" data-c="law">Decide Newton’s law is wrong</button>'+
    '<button class="opt" data-c="planet">Predict another hidden planet</button>'+
    '<button class="opt" data-c="wait">Wait for better measurements</button></div>'+
  '<div class="block" id="lvFb"></div>'+
  '<div class="block" id="lvReveal">'+
    '<div class="pg"><div class="yr">1859–1900s · VULCAN</div>'+
      '<p>Le Verrier predicted a hidden planet inside Mercury’s orbit and named it Vulcan. In 1860 he announced that a French doctor had seen it cross the face of the Sun. Astronomers hunted for Vulcan for decades, especially during eclipses.</p><p><b>It was never found.</b></p></div>'+
    '<h3>Seen this before?</h3>'+
    '<div class="three">'+

/* ---------- LAB 1: clock ---------- */
var GM=3.986004e14, C2=8.98755179e16, RE=6.371e6, DAY=86400;
function fmtTime(s){
  var a=Math.abs(s), sign=s<0?"−":"+";
  if(a===0) return "0";
  if(a<1e-9) return sign+(a*1e12).toPrecision(2)+" trillionths of a second";
  if(a<1e-6) return sign+(a*1e9).toPrecision(2)+" billionths of a second";
  if(a<1e-3) return sign+(a*1e6).toPrecision(2)+" millionths of a second";
  if(a<1) return sign+(a*1e3).toPrecision(2)+" thousandths of a second";
  return sign+a.toPrecision(2)+" seconds";
}
function fmtH(h){ if(h<1) return Math.round(h*100)+" cm"; if(h<1000) return Math.round(h)+" m"; return Math.round(h/1000).toLocaleString()+" km"; }
function buildClock(p){
  var body=
  '<div class="stagebox"><svg id="clkSvg" viewBox="0 0 720 300"></svg></div>'+
  '<div class="ctrls"><span>Height</span><input type="range" id="clkH" min="0" max="1000" value="0"><span class="val" id="clkHv"></span></div>'+
  '<div class="row"><span class="chk" style="color:var(--ink-soft)">Jump to a real test:</span>'+
    '<button class="opt small" data-h="0.33">Lab bench · 33 cm</button>'+

    '<button class="opt small" data-h="20200000">GPS satellite · 20,200 km</button></div>'+
  '<div class="row"><label class="chk"><input type="checkbox" id="clkSpeed"> The clock is on a satellite moving at orbit speed (only above 200 km)</label></div>'+
  '<div class="readout"><div class="ro"><div class="rl">Einstein’s theory predicts</div><div class="rv" id="clkE"></div><div class="rs" id="clkE2"></div></div>'+
  '<div class="ro newton"><div class="rl">Newton’s theory predicts</div><div class="rv">0 — no difference</div><div class="rs">For Newton, gravity is a pull. It doesn’t touch time.</div></div></div>'+
  '<p class="body" style="font-size:15.5px;color:var(--ink-soft)">Both clock faces look identical. The difference is far too small for any watch — you need an atomic clock. That is the <span class="cc">tool</span>.</p>';
  p.innerHTML=labShell("clock",
    "Time runs slower closer to a heavy mass. So a clock higher above the Earth should run <i>faster</i> than an identical clock on the ground. Einstein worked this out between 1907 and 1915 — long before any clock could check it.",
    "A clock 1 metre above you: how much faster does Einstein’s theory say it runs in a day?",
    ["About a second","About a millionth of a second","Too small for any clock to measure"],
    "About 9 trillionths of a second a day. Too small for your watch — not for an atomic clock. Now raise the clock.",
    body,
    ["How much faster is the clock at 33 cm? At 450 m? At GPS height?","Tick the satellite-speed box at GPS height. What happens to the total, and why does that matter?","What does Newton’s theory predict? Could the measurement have said no to Einstein?"],
    '<p><b>Lab bench, 33 cm (NIST, USA, 2010):</b> two atomic clocks, one raised about 33 cm. The higher clock ran faster by the amount predicted — about 90 billionths of a second over an 80-year life.</p>'+
    '<p><b>Tokyo Skytree, 450 m (Japan, 2020):</b> a portable clock at the observation deck ran faster than one at the base, by the predicted amount.</p>'+
    '<p><b>GPS (every day):</b> height makes satellite clocks gain about 45 millionths of a second a day; their speed makes them lose about 7. Net: about 38 millionths a day. Engineers set the clocks to tick slightly slow before launch. Without that correction, your phone’s map would drift by about 10 km a day.</p>');
  wireShell(p,"clock","About 9 trillionths of a second a day. Too small for your watch — not for an atomic clock. Now raise the clock.");
  var svg=$("#clkSvg",p), sl=$("#clkH",p), sp=$("#clkSpeed",p);
  var fixedH=null;
  function hFrom(v){ return fixedH!==null?fixedH:Math.pow(10, -1 + v/1000*8.6); }
  function vFrom(h){ return (Math.log10(h)+1)/8.6*1000; }
  var ang=0, raf=null;
  function face(x,y,r,label,col){
    var hx=x+Math.sin(ang)*r*0.78, hy=y-Math.cos(ang)*r*0.78;
    var mx=x+Math.sin(ang/12)*r*0.55, my=y-Math.cos(ang/12)*r*0.55;
    var t='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#f7f2e6" stroke="'+col+'" stroke-width="3"/>';
    for(var i=0;i<12;i++){var a=i*Math.PI/6; t+='<line x1="'+(x+Math.sin(a)*r*.82)+'" y1="'+(y-Math.cos(a)*r*.82)+'" x2="'+(x+Math.sin(a)*r*.94)+'" y2="'+(y-Math.cos(a)*r*.94)+'" stroke="#5a5145" stroke-width="1.5"/>';}
    t+='<line x1="'+x+'" y1="'+y+'" x2="'+mx+'" y2="'+my+'" stroke="#2a2622" stroke-width="3" stroke-linecap="round"/>';
    t+='<line x1="'+x+'" y1="'+y+'" x2="'+hx+'" y2="'+hy+'" stroke="#8a3b2a" stroke-width="1.6" stroke-linecap="round"/>';
    t+='<circle cx="'+x+'" cy="'+y+'" r="3" fill="#2a2622"/>';
    t+='<text x="'+x+'" y="'+(y+r+16)+'" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" fill="#cbbf9f">'+label+'</text>';
    return t;
  }
  function draw(){
    var h=hFrom(+sl.value), t=vFrom(h)/1000;
    var top=34, bot=238, y=bot-(bot-top)*t;
    var s='<defs><linearGradient id="sky" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2b4a73"/><stop offset=".35" stop-color="#1b2840"/><stop offset="1" stop-color="#0f1420"/></linearGradient></defs>';
    s+='<rect width="720" height="300" fill="url(#sky)"/>';
    for(var i=0;i<40;i++){ var sx=(i*97)%700+10, sy=(i*53)%150+8; s+='<circle cx="'+sx+'" cy="'+sy+'" r="'+((i%3)*.4+.5)+'" fill="#fff" opacity="'+(0.15+0.5*t)+'"/>'; }
    s+='<path d="M0 262 Q360 236 720 262 L720 300 L0 300 Z" fill="#3f6b3a"/><path d="M0 262 Q360 236 720 262" stroke="#7fa36b" stroke-width="2" fill="none"/>';
    // height scale
    s+='<line x1="70" y1="'+top+'" x2="70" y2="'+bot+'" stroke="#cbbf9f" stroke-width="1"/>';
    [[0.33,"33 cm"],[450,"450 m"],[1e4,"10 km (jet)"],[2.02e7,"GPS 20,200 km"]].forEach(function(m){ var yy=bot-(bot-top)*(vFrom(m[0])/1000);
      s+='<line x1="64" y1="'+yy+'" x2="76" y2="'+yy+'" stroke="#cbbf9f"/><text x="80" y="'+(yy+4)+'" font-family="JetBrains Mono,monospace" font-size="10" fill="#cbbf9f">'+m[1]+'</text>'; });
    s+='<line x1="470" y1="'+(y+30)+'" x2="470" y2="'+(250)+'" stroke="#caa24a" stroke-dasharray="4 4"/>';
    s+=face(600,214,30,"GROUND CLOCK","#5a5145");
    s+=face(470,y,28,"RAISED CLOCK","#caa24a");
    svg.innerHTML=s;
    var dG=GM/C2*(1/RE-1/(RE+h))*DAY, dV=0;
    sp.disabled=h<2e5; if(sp.disabled) sp.checked=false;
    if(sp.checked){ dV=-(GM/(RE+h))/(2*C2)*DAY; }
    var tot=dG+dV;
    $("#clkHv",p).textContent=fmtH(h);
    $("#clkE",p).textContent=fmtTime(tot)+" per day";
    $("#clkE2",p).innerHTML= sp.checked? "Height: "+fmtTime(dG)+" · speed: "+fmtTime(dV)+"<br>Over 80 years: "+fmtTime(tot*365.25*80) : "Over 80 years: "+fmtTime(tot*365.25*80);
  }
  function loop(){ ang+=0.06; draw(); raf=requestAnimationFrame(loop); }
  sl.oninput=function(){ fixedH=null; draw(); }; sp.onchange=draw;
  $$("[data-h]",p).forEach(function(b){ b.onclick=function(){ sl.value=vFrom(+b.dataset.h); fixedH=+b.dataset.h; draw(); }; });
  labStarters.clock=function(){ if(!raf) loop(); };
  draw();
}

function buildLight(p){
  var body=
  '<div class="stagebox"><canvas id="lensCv" width="560" height="320"></canvas></div>'+
  '<div class="ctrls"><span>Mass of the near galaxy</span><input type="range" id="lensM" min="0" max="100" value="0"><span class="val" id="lensMv"></span>'+
  '<span>Line-up (far galaxy’s position)</span><input type="range" id="lensB" min="0" max="100" value="70"><span class="val" id="lensBv"></span></div>'+
  '<div class="row"><label class="chk"><input type="checkbox" id="lensTrue" checked> Show where the far galaxy really is</label>'+
  '<label class="chk"><input type="checkbox" id="lensNewton"> Use the Newton-style amount of bending (half of Einstein’s)</label></div>'+
  '<p class="body" style="font-size:15.5px;color:var(--ink-soft)">The orange glow is a heavy galaxy close to us. The blue galaxy is much farther away, behind it. You are looking from Earth.</p>';
  p.innerHTML=labShell("light",
    "Mass bends space, so light passing a heavy object should bend — and by a set amount: twice what you get if you treat light as tiny particles pulled by Newton’s gravity. Einstein published the number in 1915.",
    "Line the far galaxy up exactly behind the heavy one. What will you see from Earth?",
    ["Nothing — it’s hidden behind","The same galaxy, just dimmer","Something with a different shape"],
    "Try it. Start with no mass, then turn the mass up, then slide the far galaxy into line.",
    body,
    ["With zero mass, where does the far galaxy appear? Now turn the mass up. What happens to its image?","Slide it into a perfect line-up. Describe the shape.","Tick the Newton box. What changes? Why does that make this a test that could say no?"],
    '<p><b>1919 eclipse:</b> during a total eclipse, stars near the Sun can be photographed. Einstein’s theory predicted starlight grazing the Sun would shift by 1.75 arcseconds; the Newton-style figure was half that. Two British expeditions (Sobral in Brazil, Príncipe off Africa) measured shifts closer to Einstein’s number. Their data were rough — critics said so at the time.</p>'+
    '<p><b>Since then:</b> radio telescopes have measured the bending of light by the Sun many times, agreeing with Einstein to better than one part in a thousand. Hubble and JWST have photographed far galaxies stretched into arcs and full rings around nearer heavy galaxies — the shapes in this lab.</p>');
  wireShell(p,"light","Try it. Start with no mass, then turn the mass up, then slide the far galaxy into line.");
  var cv=$("#lensCv",p), ctx=cv.getContext("2d"), W=cv.width, H=cv.height, S=70, cx=W/2, cy=H/2;
  var img=ctx.createImageData(W,H);
  function draw(){
    var m=+$("#lensM",p).value/100, bx=(+$("#lensB",p).value/100)*2.2, newton=$("#lensNewton",p).checked;
    var tE2=Math.pow(1.15*m,2)*(newton?0.5:1), sig=0.17, d=img.data;
    $("#lensMv",p).textContent=m===0?"none":Math.round(m*100)+"%";
    $("#lensBv",p).textContent=bx<0.04?"perfect line-up":"off-line";
    for(var py=0;py<H;py++){ for(var px=0;px<W;px++){
      var x=(px-cx)/S, y=(py-cy)/S, r2=x*x+y*y+1e-6, f=tE2/r2, sx=x-f*x, sy=y-f*y;
      var dd=(sx-bx)*(sx-bx)+sy*sy, I=Math.exp(-dd/(2*sig*sig));
      var k=(py*W+px)*4;
      d[k]=20+I*190; d[k+1]=26+I*215; d[k+2]=38+I*235; d[k+3]=255;
    }}
    ctx.putImageData(img,0,0);
    // stars
    ctx.fillStyle="rgba(255,255,255,.5)"; for(var i=0;i<30;i++){ ctx.fillRect((i*131)%W,(i*71)%H,1.2,1.2); }
    // lens galaxy glow
    if(m>0){ var g=ctx.createRadialGradient(cx,cy,0,cx,cy,18+30*m); g.addColorStop(0,"rgba(255,214,150,.95)"); g.addColorStop(.4,"rgba(230,160,80,.45)"); g.addColorStop(1,"rgba(230,160,80,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,18+30*m,0,7); ctx.fill(); }
    if($("#lensTrue",p).checked){ ctx.setLineDash([4,4]); ctx.strokeStyle="rgba(202,162,74,.9)"; ctx.lineWidth=1.3; ctx.beginPath(); ctx.arc(cx+bx*S,cy,sig*S*1.8,0,7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle="rgba(202,162,74,.95)"; ctx.font="11px JetBrains Mono, monospace"; ctx.fillText("really here",cx+bx*S-34,cy-sig*S*1.8-6); }
    ctx.fillStyle="rgba(203,191,159,.85)"; ctx.font="11px JetBrains Mono, monospace"; ctx.fillText("VIEW FROM EARTH",12,20);
  }
  ["lensM","lensB"].forEach(function(id){ $("#"+id,p).oninput=draw; });
  ["lensTrue","lensNewton"].forEach(function(id){ $("#"+id,p).onchange=draw; });
  draw();
}

  '<div class="row"><button class="btn sm" id="gwGo">▶ Two black holes merge</button><button class="btn sm ghost" id="gwTruck">A truck drives past Hanford</button><button class="btn sm ghost" id="gwClear">Clear</button></div>'+
  '<p class="body" style="font-size:15.5px;color:var(--ink-soft)">LIGO has two detectors about 3,000 km apart: one in Hanford, Washington, and one in Livingston, Louisiana. Each uses lasers to measure a change in length far smaller than a proton.</p>';
  p.innerHTML=labShell("waves",
    "When huge masses move, they should send ripples through space itself, travelling at the speed of light. Einstein predicted these gravitational waves in 1916 — and thought they would be far too small ever to detect.",
    "If a real ripple from space passes the Earth, what should the two detectors show?",
    ["The same signal in both","A signal in only one","Two completely different signals"],
    "Run it. Then run the truck. Compare.",
    body,
    ["Describe the black hole signal. What happens to it just before the merger?","What is different about the truck signal?","Why does having two detectors far apart make the evidence stronger?"],
    '<p><b>14 September 2015:</b> both LIGO detectors recorded the same rising “chirp”, Livingston about 7 thousandths of a second before Hanford — the right gap for a ripple crossing the USA at light speed. Its shape matched what Einstein’s theory predicts for two black holes, each about 30 times the mass of the Sun, merging about 1.3 billion light-years away. Predicted 1916, detected 2015.</p>'+
    '<p>Since then, LIGO and its partner detectors have recorded many more mergers.</p>');
  wireShell(p,"waves","Run it. Then run the truck. Compare.");
  var cv=$("#gwCv",p), ctx=cv.getContext("2d"), W=cv.width, H=cv.height;
  var N=600, Tm=0.82, sigL=null, sigH=null, prog=0, running=false, truck=null, raf=null;
  function chirp(t){ // t in 0..1 window
    if(t<0) return 0;
    if(t<Tm){ var tau=Tm-t; var a=0.07/Math.pow(tau+0.004,0.25); return a*Math.cos(2*Math.PI*10.5*Math.pow(tau+0.004,0.625)); }
    var dt=t-Tm; return 0.28*Math.exp(-dt*60)*Math.cos(2*Math.PI*60*dt);
  }
  function noise(){ return (Math.random()-.5)*0.05; }
  function makeSignals(){
    sigL=[];sigH=[];
    for(var i=0;i<N;i++){ var t=i/N; sigL.push(chirp(t)+noise()); sigH.push(chirp(t-0.028)+noise()); }
  }
  function drawTrace(arr, y0, label, col, upto){
    ctx.fillStyle="rgba(203,191,159,.85)"; ctx.font="11px JetBrains Mono, monospace"; ctx.fillText(label,12,y0-46);
    ctx.strokeStyle="rgba(203,191,159,.25)"; ctx.beginPath(); ctx.moveTo(10,y0); ctx.lineTo(W-10,y0); ctx.stroke();
    if(!arr) return;
    ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.beginPath();
    for(var i=0;i<upto;i++){ var x=10+(W-20)*i/N, y=y0-arr[i]*90; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
    ctx.stroke();
  }
  function draw(){
    ctx.fillStyle="#141a26"; ctx.fillRect(0,0,W,H);
    // orbit panel
    var t=prog/N, ox=W/2, oy=70;
    if(running||prog>0){
      if(t<Tm){ var tau=Math.max(Tm-t,0.001), sep=14+52*Math.pow(tau/Tm,0.5), ph=60*Math.pow(Tm,0.625)-60*Math.pow(tau,0.625);
        for(var r=1;r<6;r++){ ctx.strokeStyle="rgba(202,162,74,"+(0.22-r*0.035)+")"; ctx.beginPath(); ctx.arc(ox,oy,sep+r*22+((prog*2)%22),0,7); ctx.stroke(); }
        [0,Math.PI].forEach(function(o,j){ ctx.fillStyle="#000"; ctx.strokeStyle="#caa24a"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(ox+Math.cos(ph+o)*sep*(j?1.15:0.9),oy+Math.sin(ph+o)*sep*0.35*(j?1.15:0.9),j?11:12,0,7); ctx.fill(); ctx.stroke(); });
      } else { ctx.fillStyle="#000"; ctx.strokeStyle="#caa24a"; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(ox,oy,17,0,7); ctx.fill(); ctx.stroke();
        for(var r2=1;r2<5;r2++){ ctx.strokeStyle="rgba(202,162,74,"+(0.35-r2*0.07)+")"; ctx.beginPath(); ctx.arc(ox,oy,17+r2*14+(prog-Tm*N)*1.5,0,7); ctx.stroke(); } }
    } else { ctx.fillStyle="rgba(203,191,159,.6)"; ctx.font="12px JetBrains Mono, monospace"; ctx.textAlign="center"; ctx.fillText("press ▶ to merge two black holes",ox,oy+4); ctx.textAlign="left"; }
    ctx.fillStyle="rgba(203,191,159,.85)"; ctx.font="11px JetBrains Mono, monospace"; ctx.fillText("1.3 BILLION LIGHT-YEARS AWAY",12,20);
    var upto=Math.min(prog,N);
    drawTrace(sigL&&!truck?sigL:(truck?truck.L:null), 210, "LIVINGSTON, LOUISIANA", "#7fb0e6", truck?N:upto);
    drawTrace(sigH&&!truck?sigH:(truck?truck.H:null), 312, "HANFORD, WASHINGTON", "#e6b47f", truck?N:upto);
  }
  function step(){ prog+=3; draw(); if(prog<N){ raf=requestAnimationFrame(step); } else { running=false; } }
  $("#gwGo",p).onclick=function(){ truck=null; makeSignals(); prog=0; running=true; cancelAnimationFrame(raf); step(); };
  $("#gwTruck",p).onclick=function(){ cancelAnimationFrame(raf); running=false; prog=0; sigL=null; sigH=null;
    var L=[],Hh=[], c=0.3+Math.random()*0.4; for(var i=0;i<N;i++){ var t=i/N; L.push(noise()); Hh.push(noise()+0.3*Math.exp(-Math.pow((t-c)/0.05,2))*Math.sin(2*Math.PI*9*t)); }
    truck={L:L,H:Hh}; draw(); };
  $("#gwClear",p).onclick=function(){ cancelAnimationFrame(raf); running=false; prog=0; sigL=sigH=null; truck=null; draw(); };
  labStarters.waves=function(){ draw(); };
  draw();
}

/* ---------- LAB 4: shadow ---------- */
function buildShadow(p){
  var body=
  '<div class="stagebox"><canvas id="bhCv" width="560" height="340"></canvas></div>'+
  '<div class="ctrls"><span>Mass (billions of Suns)</span><input type="range" id="bhM" min="10" max="120" value="20"><span class="val" id="bhMv"></span></div>'+
  '<div class="row"><label class="chk"><input type="checkbox" id="bhPhoto"> Overlay the size measured in the 2019 photo</label></div>'+
  '<div class="readout"><div class="ro"><div class="rl">Einstein’s theory predicts a ring about</div><div class="rv" id="bhP"></div><div class="rs">millionths of an arcsecond across (as seen from Earth)</div></div>'+
  '<div class="ro"><div class="rl">The mass, measured separately</div><div class="rv">≈ 6.5 billion Suns</div><div class="rs">from how fast the stars near the centre of galaxy M87 move</div></div></div>';
  p.innerHTML=labShell("shadow",
    "Einstein’s equations allow black holes: so much mass in so small a space that nothing gets out. They also predict how big its shadow should look, from its mass and distance. (Einstein himself doubted black holes could really exist.)",
    "A heavier black hole: will its shadow look bigger or smaller?",
    ["Bigger","Smaller","Same size"],
    "Find out. Then set the mass to the value astronomers measured from M87’s stars.",
    body,
    ["What happens to the shadow as the mass goes up?","Set the mass to 6.5 billion Suns. What size does the theory predict? Now overlay the photo.","The mass came from watching stars; the ring came from radio telescopes. Why does it matter that these are two different tools?"],
    '<p><b>April 2019 — the Event Horizon Telescope:</b> radio telescopes across the planet, linked into one Earth-sized telescope, photographed the black hole at the centre of galaxy M87, 55 million light-years away. Four teams turned the data into images separately, without comparing notes. The ring measured about 42 millionths of an arcsecond — the size Einstein’s theory predicts for the mass measured from the stars.</p>'+
    '<p>That is about the size of an orange on the Moon, seen from Earth. In 2022 the same team photographed the black hole at the centre of our own galaxy.</p>');
  wireShell(p,"shadow","Find out. Then set the mass to the value astronomers measured from M87’s stars.");
  var cv=$("#bhCv",p), ctx=cv.getContext("2d"), W=cv.width, H=cv.height;
  function draw(){
    var M=+$("#bhM",p).value/10, pred=39.6*M/6.5, px=pred*2.6; // px per microarcsec
    $("#bhMv",p).textContent=M.toFixed(1); $("#bhP",p).textContent="≈ "+Math.round(pred);
    ctx.fillStyle="#0b0d12"; ctx.fillRect(0,0,W,H);
    var cx=W/2, cy=H/2, R=px/2;
    var g=ctx.createRadialGradient(cx,cy,R*0.55,cx,cy,R*1.45);
    g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(0.42,"rgba(120,40,10,.9)"); g.addColorStop(0.55,"rgba(255,170,60,1)"); g.addColorStop(0.7,"rgba(200,80,20,.8)"); g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R*1.5,0,7); ctx.fill();
    var g2=ctx.createLinearGradient(cx,cy-R,cx,cy+R); g2.addColorStop(0,"rgba(0,0,0,.45)"); g2.addColorStop(1,"rgba(255,200,120,.25)");
    ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(cx,cy,R*1.5,0,7); ctx.fill();
    ctx.fillStyle="#000"; ctx.beginPath(); ctx.arc(cx,cy,R*0.62,0,7); ctx.fill();
    if($("#bhPhoto",p).checked){ var Rm=42*2.6/2; ctx.setLineDash([6,5]); ctx.strokeStyle="#7fb0e6"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,Rm,0,7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle="#7fb0e6"; ctx.font="11px JetBrains Mono, monospace"; ctx.fillText("2019 PHOTO: RING ≈ 42",cx+Rm+8,cy-Rm+10); }
    ctx.fillStyle="rgba(203,191,159,.85)"; ctx.font="11px JetBrains Mono, monospace"; ctx.fillText("M87 · 55 MILLION LIGHT-YEARS",12,20);
  }
  $("#bhM",p).oninput=draw; $("#bhPhoto",p).onchange=draw; draw();
}

/* ---- 5. Be the sceptic ---- */
addStage("Be the sceptic", function(el){
  var K=LABORDER;
  el.innerHTML=
  '<div class="micro">Part 4 · Try to break it</div>'+
  '<h2>Be the sceptic: explain the labs away</h2>'+
  '<div class="lens">Perspective · the doubter’s</div>'+
  '<p class="lead">Some of you said Einstein might be wrong. Here’s your chance. For each result, find an ordinary <span class="cc">explanation</span> that doesn’t need Einstein’s theory: a faulty tool, an earthquake, a mistake, a coincidence. Work in pairs. Be a good sceptic.</p>'+
  '<div data-log></div>'+
  '<div class="cards4">'+K.map(function(k){return '<div class="scard"><div class="st">'+LOG[k].pred+'</div><div class="sm">PREDICTED '+LOG[k].py+' · TOOL: '+LOG[k].tool.toUpperCase()+' · CHECKED '+LOG[k].cy+'</div><textarea data-x="'+k+'" placeholder="Our ordinary explanation (no Einstein)…"></textarea></div>';}).join("")+'</div>'+
  '<button class="btn sm" id="xTest">Test the explanations →</button>'+
  '<div class="block" id="xBlk">'+
    '<p class="lead" style="margin-top:12px">Take each explanation. Be honest: does it also explain the <i>other</i> results? Click the ones it explains.</p>'+
    '<div id="xRows"></div><div class="counter" id="xCount"></div>'+
    '<div class="talk"><div class="tl">Talk</div><div class="tb">Is there <i>one</i> explanation that covers all four? If someone says “the scientists are faking it”: who would have to be in on it, in how many countries — and how does your phone’s GPS still work?</div></div>'+
    '<div class="talk"><div class="tl">Talk</div><div class="tb">To keep doubting Einstein, you need a separate explanation for each result. Who does that sound like?</div></div>'+
    '<button class="btn sm ghost" id="xName">Open after you’ve talked</button>'+
  '</div>'+
  '<div class="block" id="xNameBlk"><div class="nameit"><div class="nl">Name it — Independent convergence</div><div class="nb">'+
    '<p>Four different predictions, checked with four different <span class="cc">tools</span>, by different teams, decades apart. Each one could have come out the other way. Every one came out as predicted.</p>'+
    '<p>Each of your explanations only explains its own result. To reject the theory, you need four separate mistakes that all happen to point exactly where Einstein said. That is the same move as Vulcan, phrenology and the land bridges — explaining away one result at a time — except now the sceptic is the one doing it.</p>'+
    '<p><span class="cc">Certainty</span>: this still isn’t 100%. But every independent line that agrees makes doubting the theory more expensive.</p></div></div></div>'+
  navHTML("Next");
  wireNav(el); refreshLogs();
  $("#xTest",el).onclick=function(){
    var rows=$("#xRows",el); rows.innerHTML="";
    var any=false;
    K.forEach(function(k){
      var txt=$('[data-x="'+k+'"]',el).value.trim(); if(!txt) return; any=true;
      var div=document.createElement("div"); div.className="xrow"; div.dataset.k=k;
      div.innerHTML='<div class="xq">For <b>'+LABNAMES[k].toLowerCase()+'</b>: <i>“'+txt.replace(/</g,"&lt;")+'”</i> — does it also explain…</div><div class="xc">'+
        K.filter(function(o){return o!==k;}).map(function(o){return '<button class="opt small" data-o="'+o+'">'+LABNAMES[o]+'?</button>';}).join("")+'</div><div class="tally"></div>';
      rows.appendChild(div);
    });
    if(!any){ rows.innerHTML='<div class="fb">Write at least one explanation in the boxes above first.</div>'; }
    $$(".xrow .opt",rows).forEach(function(b){ b.onclick=function(){ b.classList.toggle("picked"); tally(); }; });
    show($("#xBlk",el)); tally();
  };
  function tally(){
    var covered={}, n=0;
    $$(".xrow",el).forEach(function(r){ var c=1+$$(".opt.picked",r).length; $(".tally",r).textContent="This explanation covers "+c+" of 4 results.";
      covered[r.dataset.k]=1; $$(".opt.picked",r).forEach(function(b){covered[b.dataset.o]=1;}); n++; });
    var unexplained=K.filter(function(k){return !covered[k];}).length;
    $("#xCount",el).textContent= n? ("Explanations used: "+n+"  ·  results still not explained away: "+unexplained) : "";
  }
  $("#xName",el).onclick=function(){ show($("#xNameBlk",el)); this.style.display="none"; };
});

/* ---- 6. How settled? ---- */
addStage("How settled?", function(el){
  el.innerHTML=
  '<div class="micro">Part 5 · Where the theory runs out</div>'+
  '<h2>So is it settled?</h2>'+
  '<div class="lens">Scope · observation vs theory</div>'+
  '<h3>Back to the black hole</h3>'+
  '<p class="body">In Lesson 3 we called knowing what is at the centre of a black hole a <b>never</b>. Some of you argued back: maybe the laws of physics will change. Here is what we know about black holes, split into two kinds:</p>'+
  '<div class="two">'+
    '<div class="mini obs"><div class="ml">Observed (from outside)</div>The ring and dark centre in the 2019 photo.<br>The shadow is the size the theory predicted.<br>Ripples arrived when black holes merged.</div>'+
    '<div class="mini th"><div class="ml">What the theory says (no one can observe)</div>Nothing that crosses the edge can ever send a signal back out.<br>At the very centre, everything is crushed into a single point.</div>'+
  '</div>'+
  '<div class="prompt">Predict</div><div class="qline">Suppose Einstein’s theory is replaced one day. Which column could change?</div>'+
  '<div class="opts" id="bhOpts"><button class="opt" data-c="o">The observed column</button><button class="opt" data-c="t">The theory column</button><button class="opt" data-c="b">Both</button><button class="opt" data-c="n">Neither</button></div>'+
  '<div class="block" id="bhRev">'+
    '<div class="nameit"><div class="nl">Observation vs theory</div><div class="nb">'+
      '<p>The observations stay. Any new theory has to produce the same photo and the same ripples — just as Einstein still had to produce Neptune.</p>'+
      '<p>The theory column comes from the theory, so it could change. And the centre is exactly where physicists expect Einstein’s theory to break down: it predicts infinite density there, and it doesn’t fit with quantum physics. The <span class="cc">scope</span> of the theory may end right where the “never” begins.</p></div></div>'+
    '<div class="talk"><div class="tl">Talk</div><div class="tb">Some of you said “the laws of physics might change.” Others said they never change. Is that nature changing — or our theory of nature? So is the centre of a black hole a never? Never according to what?</div></div>'+
  '</div>'+
  '<h3>Le Verrier’s problem, today</h3>'+
  '<p class="body">Stars at the edges of galaxies orbit so fast that, counting only the matter we can see, the galaxies should fly apart. Another gap that won’t go away — a known unknown. Physicists are in Le Verrier’s position again, with two <span class="cc">perspectives</span>:</p>'+
  '<div class="two">'+
    '<div class="pos"><div class="ph">The Neptune move</div><div class="ps">There is matter we can’t see: <strong>dark matter</strong>. Most physicists hold this. Several separate kinds of evidence point to it. But no one has caught a dark matter particle yet.</div></div>'+
    '<div class="pos"><div class="ph">The Mercury move</div><div class="ps">Gravity itself works differently at the size of galaxies: <strong>modified gravity</strong>. A minority of physicists hold this.</div></div>'+
  '</div>'+
  '<div class="prompt">Vote</div><div class="qline">Which would you bet on — and what would it take to change your mind?</div>'+
  '<div class="opts" id="dmOpts"><button class="opt">Neptune move: unseen matter</button><button class="opt">Mercury move: gravity changes</button><button class="opt">Can’t tell yet</button></div>'+
  '<div class="block" id="dmRev"><div class="fb">Nobody knows yet. That is what a known unknown looks like from the inside. And if a new theory is coming, it may be one nobody has imagined: an unknown unknown can’t be named in advance. Whatever replaces Einstein will still have to get your GPS right, just as Einstein still had to get Neptune right.</div>'+
    '<div class="talk"><div class="tl">Before you re-rank</div><div class="tb">Where in this lesson were knowers right to be most certain, and where should they have been less certain? What made the difference?</div></div></div>'+
  navHTML("Re-rank");
  wireNav(el);
  $$("#bhOpts .opt",el).forEach(function(b){ b.onclick=function(){ $$("#bhOpts .opt",el).forEach(function(x){x.classList.remove("picked");}); b.classList.add("picked"); show($("#bhRev",el)); }; });
  $$("#dmOpts .opt",el).forEach(function(b){ b.onclick=function(){ $$("#dmOpts .opt",el).forEach(function(x){x.classList.remove("picked");}); b.classList.add("picked"); show($("#dmRev",el)); }; });
});

/* ---- 7. Re-rank ---- */
addStage("Re-rank", function(el){
  el.innerHTML=
  '<div class="micro">Last step · Order it again</div>'+
  '<h2>Re-rank — now with questions to ask</h2>'+
  '<p class="lead">For each claim, ask: How many <b>independent predictions</b> has it passed, checked with different tools? Is anything still <b>not fitting</b>? And is it an <b>observation</b>, or what a theory says lies beyond what we can see?</p>'+
  '<div class="compare"><div><h4>Round 1 — your gut</h4><ol class="prev" id="prev1"></ol></div><div><h4>Round 2 — with the questions</h4><ol class="rank" id="rank2"></ol></div></div>'+
  '<div class="note"><div class="hl">✎ Notebook</div><div class="hb">Answer the Knowledge Question again, properly this time (4–5 sentences). Our class said Einstein might be wrong. How certain should a knower be about Einstein’s theory, and what could change if it is replaced? Use what happened when you tried to explain the labs away, and the difference between observation and theory. Your answer has to hold two things at once: settled science is <b>not permanent</b>, but it is <b>not just opinion</b> either.</div></div>'+
  '<div class="done-card"><div class="dl">That’s the activity</div><div class="db">Compare your first answer to the Knowledge Question with this one. What changed?</div></div>'+
  navHTML(null);
  wireNav(el);
  var prev=$("#prev1",el); (round1||CARDS).forEach(function(c,i){ var li=document.createElement("li"); li.textContent=(i+1)+".  "+c.text; prev.appendChild(li); });
  makeRankList($("#rank2",el),(round1||CARDS).slice());
});

/* ================= boot ================= */
var dotsWrap=$("#dots"), stepname=$("#stepname"), screens=$("#screens");
stages.forEach(function(def,i){ var sec=document.createElement("section"); sec.className="stage"; screens.appendChild(sec); stageEls.push(sec);
  var d=document.createElement("div"); d.className="dot"; d.title=def.name; d.onclick=function(){go(i);}; dotsWrap.appendChild(d); });
function go(i){
  if(i<0||i>=stages.length) return; idx=i;
  stageEls.forEach(function(s,j){ s.classList.toggle("show",j===i); if(j===i&&!s.dataset.built){ stages[j].build(s); s.dataset.built="1"; } });
  $$(".dot").forEach(function(d,j){ d.classList.toggle("active",j===i); d.classList.toggle("done",j<i); });
  stepname.textContent=(i+1)+" / "+stages.length+" · "+stages[i].name;
  refreshLogs();
  window.scrollTo({top:0,behavior:"smooth"});
}
var hdr=$("header.pin"); window.addEventListener("scroll",function(){ var y=window.scrollY; if(y>180) hdr.classList.add("slim"); else if(y<20) hdr.classList.remove("slim"); });
go(0);
})();
</script>
